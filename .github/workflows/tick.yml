# Backup scheduler for the bot (Phase 5.5). The primary trigger is a
# cron-job.org job ("FPL tick (5 min)") that calls /api/cron/tick every five
# minutes with the x-cron-secret header: GitHub throttled this schedule to
# once every few hours on 2026-09-04 and the GW3 reminder was missed. This
# workflow stays as a fallback; the route's Redis claims mean the two never
# double-post.
#
# Needs a repository secret CRON_SECRET (matching the Vercel env var) and a
# repository variable APP_URL, e.g. https://your-app.vercel.app.
name: tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL variable and CRON_SECRET secret must be set" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/tick"
