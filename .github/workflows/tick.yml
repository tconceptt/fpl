# The bot's scheduler (Phase 5.5). Calls /api/cron/tick every five minutes;
# the route decides whether a deadline reminder or a recap is due and sends
# at most one of each per gameweek. Schedules can slip by several minutes
# under load, which the 30-minute reminder window tolerates.
#
# Needs a repository secret CRON_SECRET (matching the Vercel env var) and a
# repository variable APP_URL, e.g. https://your-app.vercel.app.
name: tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL variable and CRON_SECRET secret must be set" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/tick"
